
bind = $mainMod, Return, exec, $terminal
bind = $mainMod, Q, killactive,
bind = $mainMod, M, exit,
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, V, togglefloating,
bind = $mainMod, R, exec, $menu
bind = $mainMod, D, exec, $menu
bind = $mainMod, F, fullscreen,

bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

bind = $mainMod Shift, left, movewindow, l
bind = $mainMod Shift, right, movewindow, r
bind = $mainMod Shift, up, movewindow, u
bind = $mainMod Shift, down, movewindow, d

bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9

bind = $mainMod Shift, 1, movetoworkspace, 1
bind = $mainMod Shift, 2, movetoworkspace, 2
bind = $mainMod Shift, 3, movetoworkspace, 3
bind = $mainMod Shift, 4, movetoworkspace, 4
bind = $mainMod Shift, 5, movetoworkspace, 5
bind = $mainMod Shift, 6, movetoworkspace, 6
bind = $mainMod Shift, 7, movetoworkspace, 7
bind = $mainMod Shift, 8, movetoworkspace, 8
bind = $mainMod Shift, 9, movetoworkspace, 9

bind = , Print, exec, hyprshot -m output
bind = Shift, Print, exec, hyprshot -m region
bind = $mainMod Shift, Print, exec, hyprshot -m window

bind = $mainMod, L, exec, hyprlock
bind = $mainMod, W, exec, /home/bitplugg/.local/bin/wallpaper-picker
bind = $mainMod, Escape, exec, ~/.local/bin/powermenu
bind = $mainMod Shift, Escape, exec, $terminal -e btop
bind = $mainMod, F1, exec, ~/.local/bin/keybind-help
bind = $mainMod, N, exec, swaync-client -t
bind = $mainMod Shift, I, exec, ~/.local/bin/idle-inhibit
bind = $mainMod Shift, C, exec, ~/.local/bin/waybar-colorpicker
bind = $mainMod Shift, V, exec, cliphist list | ~/.local/bin/dmenu -p "Clipboard" | cliphist decode | wl-copy
bind = $mainMod Shift, R, exec, wf-recorder -f "$(xdg-user-dir VIDEOS)/recording_$(date +%Y%m%d_%H%M%S).mp4" --geometry "$(slurp)"
bind = $mainMod Shift, A, exec, ~/.local/bin/workspace-overview
bind = $mainMod Shift, P, exec, ~/.local/bin/project-launcher
bind = $mainMod Shift, O, exec, ~/.local/bin/screenshot-ocr
bind = $mainMod Shift, G, exec, ~/.local/bin/git-status
bind = $mainMod Shift, T, exec, ~/.local/bin/translate
bind = $mainMod Shift, M, exec, ~/.local/bin/audio-recorder
bind = $mainMod Shift, B, exec, ~/.local/bin/break-timer
bind = $mainMod Shift, K, exec, ~/.local/bin/window-killer
bind = $mainMod Shift, S, exec, ~/.local/bin/settings
bind = $mainMod Shift, U, exec, ~/.local/bin/mic-toggle
bind = $mainMod Shift, L, exec, ~/.local/bin/night-mode
bind = $mainMod Shift, Z, exec, ~/.local/bin/screenshot-gallery
bind = $mainMod Shift, D, exec, ~/.local/bin/backup-configs
bind = $mainMod, Tab, exec, hyprswitch gui --mod-key super --key Tab
bind = mod1, Tab, exec, hyprswitch gui --mod-key alt --key Tab
bind = $mainMod, space, exec, nwg-drawer
bind = $mainMod Shift, E, exec, ~/.local/bin/emoji-picker
bind = $mainMod Shift, H, exec, ~/.local/bin/cliphist-wl
bind = $mainMod Shift, N, exec, ~/.local/bin/quick-notes
bind = $mainMod Shift, F, exec, ~/.local/bin/nerd-font-viewer
bind = $mainMod Shift, W, exec, ~/.local/bin/wifi-qr
bind = $mainMod Shift, Equal, exec, ~/.local/bin/calculator

bindel = , XF86MonBrightnessUp, exec, brightnessctl set 5%+ && swayosd-client --brightness "$(brightnessctl get)"
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%- && swayosd-client --brightness "$(brightnessctl get)"

bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind = , XF86AudioPlay, exec, playerctl play-pause
bind = , XF86AudioNext, exec, playerctl next
bind = , XF86AudioPrev, exec, playerctl previous
bind = , XF86AudioStop, exec, playerctl stop

bind = $mainMod, O, exec, ~/.local/bin/openclaw-launcher
bind = $mainMod, C, exec, ~/.local/bin/cava-toggle
bind = $mainMod CTRL, Q, exec, ~/.local/bin/ags-widget qs
bind = $mainMod CTRL, M, exec, ~/.local/bin/ags-widget mp
bind = $mainMod CTRL, S, exec, ~/.local/bin/ags-widget mon
bind = $mainMod CTRL, A, exec, ~/.local/bin/ags-widget mixer
bind = $mainMod CTRL, C, exec, ~/.local/bin/ags-widget cal
bind = $mainMod CTRL, X, exec, ~/.local/bin/ags-widget ss
bind = $mainMod CTRL, P, exec, ~/.local/bin/ags-widget pwr
bind = $mainMod CTRL, K, exec, ~/.local/bin/ags-widget kb
bind = $mainMod, A, exec, ~/.local/bin/ags-launcher toggle
