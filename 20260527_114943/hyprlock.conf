$bg = rgba(170909e6)
$fg = rgba(c5c1c1ff)
$accent = rgba(AD9A65ff)
$error = rgba(38455Fff)
$muted = rgba(6d5959ff)
$surface = rgba(170909ff)

general {
    ignore_empty_input = true
}

background {
    monitor =
    path = screenshot
    color = rgba(1e1e2eff)
    blur_passes = 4
    blur_size = 10
    noise = 0.01
    contrast = 0.9
    brightness = 0.7
    vibrancy = 0.2
    vibrancy_darkness = 0.1
}

input-field {
    monitor =
    size = 350, 60
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.35
    dots_center = true
    outer_color = rgba(00000000)
    inner_color = $surface
    font_color = $fg
    fade_on_empty = true
    fade_timeout = 2000
    placeholder_text = <i>     Enter password...</i>
    hide_input = false
    position = 0, 160
    halign = center
    valign = bottom
    fail_color = $error
    fail_text = <i>    Wrong password</i>
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = $fg
    font_size = 96
    font_family = JetBrainsMono Nerd Font ExtraBold
    position = 0, -60
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:3600] echo "$(date +'%A, %d %B %Y')"
    color = $accent
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = 0, 20
    halign = center
    valign = center
}

label {
    monitor =
    text = 
    color = $muted
    font_size = 48
    font_family = JetBrainsMono Nerd Font
    position = 0, -220
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:3000] /home/bitplugg/.local/bin/hyprlock-info
    color = $fg
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    position = 0, 100
    halign = center
    valign = center
}
